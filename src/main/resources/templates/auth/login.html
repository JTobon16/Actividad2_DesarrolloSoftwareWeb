<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CineApp</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<header class="home-header">
    <h1 class="home-logo"><span>Cine</span>App</h1>
</header>

<main class="container-login">
    <div class="login-card">

        <div class="login-header">
            <h1>Iniciar Sesión</h1>
            <p>Ingresa tus credenciales para continuar</p>
        </div>

        <div th:if="${error}" class="alert alert-error">
            <p th:text="${error}"></p>
        </div>

        <div th:if="${success}" class="alert alert-success">
            <p th:text="${success}"></p>
        </div>

        <form th:action="@{/auth/login}" method="post" class="form">

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email"
                       class="form-control" placeholder="correo@ejemplo.com" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password"
                       class="form-control" placeholder="Contraseña" required>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
            </div>

        </form>

        <!-- Link para crear cuenta -->
        <div class="login-footer">
            <p>¿No tienes cuenta?
                <a th:href="@{/users/create}" class="login-link">Crear cuenta</a>
            </p>
        </div>

    </div>
</main>

<footer class="footer">
    <p>&copy; 2025 - Universidad de Cartagena - Desarrollo Software Web</p>
</footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
