<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Usuario - CineApp</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<nav class="navbar">
    <div class="navbar-brand">
        <a th:href="@{/}"><span>C</span>INE<span>A</span>PP</a>
    </div>
    <ul class="navbar-menu">
        <li><a th:href="@{/users}">Usuarios</a></li>
        <li><a th:href="@{/entradas-cine}">Entradas de Cine</a></li>
    </ul>
    <!-- Muestra el usuario activo y boton de cerrar sesion -->
    <div class="navbar-user">
        <span class="user-name">👤 [[${session.userSession}]]</span>
        <form th:action="@{/auth/logout}" method="post">
            <button type="submit" class="btn-logout">Cerrar Sesión</button>
        </form>
    </div>
</nav>

<main class="container">
    <div class="page-header">
        <h1>Crear Usuario</h1>
        <a th:href="@{/users}" class="btn btn-secondary">Volver</a>
    </div>

    <form th:action="@{/users/create}" th:object="${user}" method="post" class="form">

        <div class="form-group">
            <label for="name">Nombre</label>
            <input type="text" id="name" th:field="*{name}"
                   class="form-control" placeholder="Nombre completo" required>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}"
                   class="form-control" placeholder="correo@ejemplo.com" required>
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" th:field="*{password}"
                   class="form-control" placeholder="Contraseña" required>
        </div>

        <div class="form-group">
            <label for="role">Rol</label>
            <select id="role" th:field="*{role}" class="form-control" required>
                <option value="">Seleccione un rol</option>
                <option value="ADMIN">Administrador</option>
                <option value="USER">Usuario</option>
            </select>
        </div>

        <div class="form-group">
            <label for="status">Estado</label>
            <select id="status" th:field="*{status}" class="form-control" required>
                <option value="">Seleccione un estado</option>
                <option value="ACTIVE">Activo</option>
                <option value="INACTIVE">Inactivo</option>
            </select>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a th:href="@{/users}" class="btn btn-secondary">Cancelar</a>
        </div>

    </form>
</main>

<footer class="footer">
    <p>&copy; 2026 - Universidad de Cartagena - Desarrollo Software Web</p>
</footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
