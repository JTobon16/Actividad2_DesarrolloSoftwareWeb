<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<!-- Cabecera -->
<th:block th:insert="~{layouts/header}"></th:block>

<!-- Menu -->
<th:block th:insert="~{layouts/menu}"></th:block>

<main class="container">
    <div class="page-header">
        <h1>Entradas de Cine</h1>
        <!-- Boton para ir al formulario de creacion -->
        <a th:href="@{/entradas-cine/create}" class="btn btn-primary">Crear Entrada</a>
    </div>

    <!-- Mensaje de exito si existe -->
    <div th:if="${success}" class="alert alert-success">
        <p th:text="${success}"></p>
    </div>

    <!-- Mensaje de error si existe -->
    <div th:if="${error}" class="alert alert-error">
        <p th:text="${error}"></p>
    </div>

    <table class="table">
        <thead>
        <tr>
            <th>Pelicula</th>
            <th>Fecha Entrada</th>
            <th>Hora Inicio</th>
            <th>Hora Fin</th>
            <th>Valor</th>
            <th>Sala</th>
            <th>Cine</th>
            <th>Ciudad</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <!-- Itera sobre la lista de entradas -->
        <tr th:each="entrada : ${entradas}">
            <td th:text="${entrada.pelicula}"></td>
            <td th:text="${entrada.fechaEntrada}"></td>
            <td th:text="${entrada.horaInicio}"></td>
            <td th:text="${entrada.horaFin}"></td>
            <td th:text="${entrada.valor}"></td>
            <td th:text="${entrada.sala}"></td>
            <td th:text="${entrada.cine}"></td>
            <td th:text="${entrada.ciudad}"></td>
            <td class="actions">
                <!-- Boton ver detalle -->
                <a th:href="@{/entradas-cine/{id}(id=${entrada.id})}"
                   class="btn btn-info">Ver</a>
                <!-- Boton editar -->
                <a th:href="@{/entradas-cine/{id}/edit(id=${entrada.id})}"
                   class="btn btn-warning">Editar</a>
                <!-- Formulario para eliminar -->
                <form th:action="@{/entradas-cine/{id}/delete(id=${entrada.id})}"
                      method="post">
                    <button type="submit" class="btn btn-danger"
                            onclick="return confirm('¿Estás seguro de eliminar esta entrada?')">
                        Eliminar
                    </button>
                </form>
            </td>
        </tr>
        <!-- Si no hay entradas -->
        <tr th:if="${#lists.isEmpty(entradas)}">
            <td colspan="9" class="text-center">No hay entradas registradas</td>
        </tr>
        </tbody>
    </table>
</main>

<!-- Pie de pagina -->
<th:block th:insert="~{layouts/footer}"></th:block>

</html>
