<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<!-- Cabecera -->
<th:block th:insert="~{layouts/header}"></th:block>

<main class="container-login">

    <div class="login-card">

        <!-- Logo o titulo -->
        <div class="login-header">
            <h1>CineApp</h1>
            <p>Inicia sesion para continuar</p>
        </div>

        <!-- Mensaje de error si las credenciales son incorrectas -->
        <div th:if="${error}" class="alert alert-error">
            <p th:text="${error}"></p>
        </div>

        <!-- Mensaje de exito si viene de otra accion -->
        <div th:if="${success}" class="alert alert-success">
            <p th:text="${success}"></p>
        </div>

        <!-- Formulario de login -->
        <form th:action="@{/auth/login}" method="post" class="form">

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email"
                       class="form-control" placeholder="correo@ejemplo.com" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password"
                       class="form-control" placeholder="Contraseña" required>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Iniciar Sesion</button>
            </div>

        </form>

    </div>

</main>

<!-- Pie de pagina -->
<th:block th:insert="~{layouts/footer}"></th:block>

</html>
