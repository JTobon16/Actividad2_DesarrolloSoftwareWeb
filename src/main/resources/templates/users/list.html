<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<!-- Cabecera -->
<th:block th:insert="~{layouts/header}"></th:block>

<!-- Menu -->
<th:block th:insert="~{layouts/menu}"></th:block>

<main class="container">
    <div class="page-header">
        <h1>Usuarios</h1>
        <!-- Boton para ir al formulario de creacion -->
        <a th:href="@{/users/create}" class="btn btn-primary">Crear Usuario</a>
    </div>

    <!-- Mensaje de exito si existe -->
    <div th:if="${success}" class="alert alert-success">
        <p th:text="${success}"></p>
    </div>

    <!-- Mensaje de error si existe -->
    <div th:if="${error}" class="alert alert-error">
        <p th:text="${error}"></p>
    </div>

    <table class="table">
        <thead>
        <tr>
            <th>Nombre</th>
            <th>Email</th>
            <th>Rol</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <!-- Itera sobre la lista de usuarios -->
        <tr th:each="user : ${users}">
            <td th:text="${user.name}"></td>
            <td th:text="${user.email}"></td>
            <td th:text="${user.role}"></td>
            <td th:text="${user.status}"></td>
            <td class="actions">
                <!-- Boton ver detalle -->
                <a th:href="@{/users/{id}(id=${user.id})}" class="btn btn-info">Ver</a>
                <!-- Boton editar -->
                <a th:href="@{/users/{id}/edit(id=${user.id})}" class="btn btn-warning">Editar</a>
                <!-- Formulario para eliminar -->
                <form th:action="@{/users/{id}/delete(id=${user.id})}" method="post">
                    <button type="submit" class="btn btn-danger"
                            onclick="return confirm('¿Estás seguro de eliminar este usuario?')">
                        Eliminar
                    </button>
                </form>
            </td>
        </tr>
        <!-- Si no hay usuarios -->
        <tr th:if="${#lists.isEmpty(users)}">
            <td colspan="5" class="text-center">No hay usuarios registrados</td>
        </tr>
        </tbody>
    </table>
</main>

<!-- Pie de pagina -->
<th:block th:insert="~{layouts/footer}"></th:block>

</html>
