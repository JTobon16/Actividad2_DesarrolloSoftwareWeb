<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<!-- Cabecera -->
<th:block th:insert="~{layouts/header}"></th:block>

<!-- Menu -->
<th:block th:insert="~{layouts/menu}"></th:block>

<main class="container">
    <div class="page-header">
        <h1>Detalle de Entrada</h1>
        <a th:href="@{/entradas-cine}" class="btn btn-secondary">Volver</a>
    </div>

    <div class="detail-card">

        <div class="detail-row">
            <span class="detail-label">Pelicula</span>
            <span class="detail-value" th:text="${entrada.pelicula}"></span>
        </div>

        <div class="detail-row">
            <span class="detail-label">Valor</span>
            <span class="detail-value" th:text="${entrada.valor}"></span>
        </div>

        <div class="detail-row">
            <span class="detail-label">Fecha de Compra</span>
            <span class="detail-value" th:text="${entrada.fechaCompra}"></span>
        </div>

        <div class="detail-row">
            <span class="detail-label">Fecha de Entrada</span>
            <span class="detail-value" th:text="${entrada.fechaEntrada}"></span>
        </div>

        <div class="detail-row">
            <span class="detail-label">Hora de Inicio</span>
            <span class="detail-value" th:text="${entrada.horaInicio}"></span>
        </div>

        <div class="detail-row">
            <span class="detail-label">Hora de Fin</span>
            <span class="detail-value" th:text="${entrada.horaFin}"></span>
        </div>

        <div class="detail-row">
            <span class="detail-label">Puesto</span>
            <span class="detail-value" th:text="${entrada.puesto}"></span>
        </div>

        <div class="detail-row">
            <span class="detail-label">Sala</span>
            <span class="detail-value" th:text="${entrada.sala}"></span>
        </div>

        <div class="detail-row">
            <span class="detail-label">Genero</span>
            <span class="detail-value" th:text="${entrada.genero}"></span>
        </div>

        <div class="detail-row">
            <span class="detail-label">Cine</span>
            <span class="detail-value" th:text="${entrada.cine}"></span>
        </div>

        <div class="detail-row">
            <span class="detail-label">Pais</span>
            <span class="detail-value" th:text="${entrada.pais}"></span>
        </div>

        <div class="detail-row">
            <span class="detail-label">Departamento</span>
            <span class="detail-value" th:text="${entrada.departamento}"></span>
        </div>

        <div class="detail-row">
            <span class="detail-label">Ciudad</span>
            <span class="detail-value" th:text="${entrada.ciudad}"></span>
        </div>

        <div class="detail-row">
            <span class="detail-label">Centro Comercial</span>
            <span class="detail-value" th:text="${entrada.centroComercial}"></span>
        </div>

        <div class="detail-row">
            <span class="detail-label">Creado</span>
            <span class="detail-value" th:text="${entrada.createdAt}"></span>
        </div>

        <div class="form-actions">
            <a th:href="@{/entradas-cine/{id}/edit(id=${entrada.id})}"
               class="btn btn-warning">Editar</a>
            <form th:action="@{/entradas-cine/{id}/delete(id=${entrada.id})}"
                  method="post">
                <button type="submit" class="btn btn-danger"
                        onclick="return confirm('¿Estás seguro de eliminar esta entrada?')">
                    Eliminar
                </button>
            </form>
        </div>

    </div>
</main>

<!-- Pie de pagina -->
<th:block th:insert="~{layouts/footer}"></th:block>

</html>
