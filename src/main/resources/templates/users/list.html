<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - CineApp</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<nav class="navbar">
    <div class="navbar-brand">
        <a th:href="@{/}"><span>C</span>INE<span>A</span>PP</a>
    </div>
    <ul class="navbar-menu">
        <li><a th:href="@{/users}">Usuarios</a></li>
        <li><a th:href="@{/entradas-cine}">Entradas de Cine</a></li>
    </ul>
    <!-- Muestra el usuario activo y boton de cerrar sesion -->
    <div class="navbar-user">
        <span class="user-name">👤 [[${session.userSession}]]</span>
        <form th:action="@{/auth/logout}" method="post">
            <button type="submit" class="btn-logout">Cerrar Sesión</button>
        </form>
    </div>
</nav>

<main class="container">
    <div class="page-header">
        <h1>Usuarios</h1>
        <a th:href="@{/users/create}" class="btn btn-primary">Crear Usuario</a>
    </div>

    <div th:if="${success}" class="alert alert-success">
        <p th:text="${success}"></p>
    </div>
    <div th:if="${error}" class="alert alert-error">
        <p th:text="${error}"></p>
    </div>

    <table class="table">
        <thead>
        <tr>
            <th>Nombre</th>
            <th>Email</th>
            <th>Rol</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.name}"></td>
            <td th:text="${user.email}"></td>
            <td th:text="${user.role}"></td>
            <td th:text="${user.status}"></td>
            <td class="actions">
                <a th:href="@{/users/{id}(id=${user.id})}" class="btn btn-info">Ver</a>
                <a th:href="@{/users/{id}/edit(id=${user.id})}" class="btn btn-warning">Editar</a>
                <form th:action="@{/users/{id}/delete(id=${user.id})}" method="post">
                    <button type="submit" class="btn btn-danger"
                            onclick="return confirm('¿Estás seguro?')">Eliminar</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(users)}">
            <td colspan="5" class="text-center">No hay usuarios registrados</td>
        </tr>
        </tbody>
    </table>
</main>

<footer class="footer">
    <p>&copy; 2026 - Universidad de Cartagena - Desarrollo Software Web</p>
</footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
