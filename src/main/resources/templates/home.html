<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineApp</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<header class="home-header">
    <h1 class="home-logo"><span>Cine</span>App</h1>
</header>

<main class="container">
    <div class="home-hero">
        <p>Sistema de gestión de entradas de cine</p>
    </div>

    <div class="home-cards">
        <div class="card">
            <div class="card-icon">👥</div>
            <h2>Usuarios</h2>
            <p>Gestiona los usuarios del sistema, roles y permisos de acceso</p>
            <a th:href="@{/users}" class="btn btn-primary">Ver Usuarios</a>
        </div>
        <div class="card">
            <div class="card-icon">🎬</div>
            <h2>Entradas de Cine</h2>
            <p>Gestiona las entradas de cine, películas, salas y horarios</p>
            <a th:href="@{/entradas-cine}" class="btn btn-primary">Ver Entradas</a>
        </div>
    </div>
</main>

<footer class="footer">
    <p>&copy; 2026 - Universidad de Cartagena - Desarrollo Software Web</p>
</footer>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
