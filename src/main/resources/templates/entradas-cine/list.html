<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entradas de Cine - CineApp</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<nav class="navbar">
    <div class="navbar-brand">
        <a th:href="@{/}"><span>C</span>INE<span>A</span>PP</a>
    </div>
    <ul class="navbar-menu">
        <li><a th:href="@{/users}">Usuarios</a></li>
        <li><a th:href="@{/entradas-cine}">Entradas de Cine</a></li>
    </ul>
</nav>

<main class="container">
    <div class="page-header">
        <h1>Entradas de Cine</h1>
        <a th:href="@{/entradas-cine/create}" class="btn btn-primary">Crear Entrada</a>
    </div>

    <div th:if="${success}" class="alert alert-success">
        <p th:text="${success}"></p>
    </div>
    <div th:if="${error}" class="alert alert-error">
        <p th:text="${error}"></p>
    </div>

    <table class="table">
        <thead>
        <tr>
            <th>Pelicula</th>
            <th>Fecha Entrada</th>
            <th>Hora Inicio</th>
            <th>Hora Fin</th>
            <th>Valor</th>
            <th>Sala</th>
            <th>Cine</th>
            <th>Ciudad</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="entrada : ${entradas}">
            <td th:text="${entrada.pelicula}"></td>
            <td th:text="${entrada.fechaEntrada}"></td>
            <td th:text="${entrada.horaInicio}"></td>
            <td th:text="${entrada.horaFin}"></td>
            <td th:text="${entrada.valor}"></td>
            <td th:text="${entrada.sala}"></td>
            <td th:text="${entrada.cine}"></td>
            <td th:text="${entrada.ciudad}"></td>
            <td class="actions">
                <a th:href="@{/entradas-cine/{id}(id=${entrada.id})}"
                   class="btn btn-info">Ver</a>
                <a th:href="@{/entradas-cine/{id}/edit(id=${entrada.id})}"
                   class="btn btn-warning">Editar</a>
                <form th:action="@{/entradas-cine/{id}/delete(id=${entrada.id})}"
                      method="post">
                    <button type="submit" class="btn btn-danger"
                            onclick="return confirm('¿Estás seguro?')">Eliminar</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(entradas)}">
            <td colspan="9" class="text-center">No hay entradas registradas</td>
        </tr>
        </tbody>
    </table>
</main>

<footer class="footer">
    <p>&copy; 2026 - Universidad de Cartagena - Desarrollo Software Web</p>
</footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
