<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle Usuario - CineApp</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<nav class="navbar">
    <div class="navbar-brand">
        <a th:href="@{/}"><span>C</span>INE<span>A</span>PP</a>
    </div>
    <ul class="navbar-menu">
        <li><a th:href="@{/users}">Usuarios</a></li>
        <li><a th:href="@{/entradas-cine}">Entradas de Cine</a></li>
    </ul>
</nav>

<main class="container">
    <div class="page-header">
        <h1>Detalle de Usuario</h1>
        <a th:href="@{/users}" class="btn btn-secondary">Volver</a>
    </div>

    <div class="detail-card">
        <div class="detail-row">
            <span class="detail-label">Nombre</span>
            <span class="detail-value" th:text="${user.name}"></span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Email</span>
            <span class="detail-value" th:text="${user.email}"></span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Rol</span>
            <span class="detail-value" th:text="${user.role}"></span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Estado</span>
            <span class="detail-value" th:text="${user.status}"></span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Creado</span>
            <span class="detail-value" th:text="${user.createdAt}"></span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Actualizado</span>
            <span class="detail-value" th:text="${user.updatedAt}"></span>
        </div>

        <div class="form-actions">
            <a th:href="@{/users/{id}/edit(id=${user.id})}" class="btn btn-warning">Editar</a>
            <form th:action="@{/users/{id}/delete(id=${user.id})}" method="post">
                <button type="submit" class="btn btn-danger"
                        onclick="return confirm('¿Estás seguro?')">Eliminar</button>
            </form>
        </div>
    </div>
</main>

<footer class="footer">
    <p>&copy; 2026 - Universidad de Cartagena - Desarrollo Software Web</p>
</footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
